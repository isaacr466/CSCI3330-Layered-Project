<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSCI 3330 Layered Project</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/main.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">CSCI 3330 · Layered Express Project</p>
      <h1>Task List</h1>
      <p class="intro">A simple frontend connected to the project's GET API route.</p>
    </header>
    <section class="panel" aria-labelledby="tasks-heading">
      <div class="panel-heading">
        <h2 id="tasks-heading">Tasks from the API</h2>
        <button id="refresh-button" type="button">Refresh</button>
      </div>
      <p id="status" role="status">Loading tasks...</p>
      <ul id="task-list"></ul>
    </section>
    <footer>Served by Express from the <code>public</code> folder.</footer>
  </main>
</body>
</html>
